# Config do Cloudflare Worker (push-worker.js) pra deploy via Wrangler CLI,
# disparado pelo GitHub Actions (.github/workflows/deploy-worker.yml) a cada
# push na main que toque em push-worker.js — substitui o "colar manualmente
# no editor do dashboard" que era o processo até 2026-08-07 (ver CLAUDE.md,
# "Decisões técnicas tomadas").
#
# ⚠️ Isso NÃO cria nem toca em secrets (CLICKUP_API_KEY, SUBSCRIBE_SECRET,
# ADMIN_SECRET, VAPID_PRIVATE_JWK) nem no KV namespace em si — só no CÓDIGO
# do Worker. Secrets continuam gerenciados manualmente (dashboard ou
# `wrangler secret put`, uma vez só) — não ficam neste arquivo, que é público
# no GitHub.
#
# 🛡️ keep_vars = true (2026-08-10, pós-incidente): SEM isso, `wrangler deploy`
# apaga qualquer var/secret que exista no Worker mas não esteja declarada
# aqui. Foi o que aconteceu com VAPID_PRIVATE_JWK/VAPID_PUBLIC_KEY nos dois
# primeiros deploys via Actions — não eram secret_text, então caíram
# silenciosamente. keep_vars=true faz o Wrangler preservar tudo que já
# existe no Worker e não está listado neste arquivo. NÃO REMOVER.
keep_vars = true

name = "chamados-ti-push"
main = "push-worker.js"
compatibility_date = "2026-08-07"

# ID real do namespace SUBSCRIPTIONS já existente na Cloudflare — pega em
# Workers & Pages → KV → (o namespace) → copiar o ID. SUBSTITUA antes do
# primeiro deploy via Actions; sem isso o Worker perde acesso ao KV.
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "68385bb44b774751aa8d7c60d5c710eb"

# Banco D1 criado em 2026-08-10 como infraestrutura temporária/exploratória
# (ver CLAUDE.md, "Decisões técnicas tomadas") — só provisionado, NENHUMA
# lógica de chamado usa isto ainda. push-worker.js continua 100% ClickUp
# como backend real; migrar pra D1 é decisão futura, ainda não tomada.
[[d1_databases]]
binding = "CHAMADOS_DB"
database_name = "chamados-ti-db"
database_id = "fdba5aac-cc0b-4017-896a-603abd31baa3"
